# Header-derived standard Amiga device-vector dispatches.
# Types and field names are resolved from amiga_ndk39.gdt at analysis time.
dispatches=begin_io

dispatch.begin_io.name=BeginIO
dispatch.begin_io.return=VOID
dispatch.begin_io.vector=-30
dispatch.begin_io.structure_type=IORequest
dispatch.begin_io.structure_field=io_Device
dispatch.begin_io.parameter.0=ioRequest|struct IORequest *|A1

# Standard device-specific IORequest subtypes used by OpenDevice.
device_request_types=audio.device,clipboard.device,console.device,gameport.device,input.device,parallel.device,serial.device,timer.device,trackdisk.device
device_request.audio.device.type=IOAudio
device_request.clipboard.device.type=IOClipReq
device_request.console.device.type=IOStdReq
device_request.gameport.device.type=IOStdReq
device_request.input.device.type=IOStdReq
device_request.parallel.device.type=IOExtPar
device_request.serial.device.type=IOExtSer
device_request.timer.device.type=timerequest
device_request.trackdisk.device.type=IOExtTD
